<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCF - Video Library</title>
    <style>
        :root { 
            --primary: #1e1b4b;     
            --secondary: #f97316;   
            --dark: #090514;        
            --light: #f8fafc;       
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--dark); color: var(--light); min-height: 100vh; padding-bottom: 2rem; }
        
        header { background-color: var(--primary); padding: 1rem 2rem; border-bottom: 2px solid var(--secondary); display: flex; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--secondary); text-decoration: none; }
        
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 2rem; 
        }
        
        .video-card { 
            background: var(--primary); 
            border: 1px solid #334155; 
            padding: 1rem; 
            border-radius: 12px;
            transition: border 0.3s;
        }
        .video-card:hover { border: 1px solid var(--secondary); }
        
        /* This ensures the video stays perfectly shaped */
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .video-wrapper video { 
            width: 100%; 
            height: 100%;
            object-fit: contain; 
        }
        
        .video-card h3 { color: var(--secondary); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .video-card p { color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">👑 GCF</a>
    </header>
    <nav>
        <a href="index.html">Get back to home</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 2rem; text-align: center;">Training Library</h1>
        
        <div class="video-grid">
            <!-- The Card -->
            <div class="video-card">
                <div class="video-wrapper">
                    <video controls>
                        <source src="When_750_makes_!!.mp4" type="video/mp4">
                    </video>
                </div>
                <h3>When a 750 makes a Brilliant move.</h3>
                <p>This game was played by BAMBARAGUNDU and GRENINJA-77. Though they had low accuracy, GCF recognizes this game for the 2 Bishop Sacrifices.</p>
            </div>
        </div>
    </div>
</body>
</html>
